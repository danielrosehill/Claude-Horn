[project]
name = "claude-horn-client"
version = "1.0"
description = "Tray client for Claude-Horn: plays a horn when an agent needs you"
requires-python = ">=3.10"
dependencies = ["paho-mqtt>=2.0", "PySide6>=6.5"]

[project.scripts]
claude-horn-client = "claude_horn_client.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["claude_horn_client"]
